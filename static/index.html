<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OCR URL</title>
</head>
<body>
  <h2>OCR URL</h2>
  <input id="imageUrl" size="80" placeholder="图片 URL">
  <label>Mode:
    <select id="ocrMode">
      <option value="text">text</option>
      <option value="markdown">markdown</option>
      <option value="latex">latex</option>
    </select>
  </label>
  <br><br>
  <button id="submitBtn" onclick="submitOCR()">Go OCR</button>
  <pre id="result" style="white-space: pre-wrap; word-wrap: break-word;"></pre>

  <script>
    async function submitOCR() {
    const btn = document.getElementById('submitBtn');
    const resultEl = document.getElementById('result');

    // ===== 进入 loading 状态 =====
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'OCR 处理中...';
    resultEl.textContent = '';

    try {
      const url = document.getElementById('imageUrl').value.trim();

      if (!url) {
        throw new Error('请输入图片 URL');
      }

      const response = await fetch('/ocr/ocr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, mode: document.getElementById('ocrMode').value })
      });

      const responseText = await response.text();
      let data;
      try {
        data = JSON.parse(responseText);
      } catch {
        const preview = responseText.replace(/\s+/g, ' ').slice(0, 160);
        throw new Error(
          `服务器返回的不是 JSON（可能是代理超时或网关错误，HTTP ${response.status}）: ${preview}`
        );
      }
      if (!response.ok) {
        throw new Error(data.detail || `HTTP ${response.status}`);
      }

      if (data.texts) {
        resultEl.textContent = JSON.stringify(data.texts, null, 2);
      } else {
        resultEl.textContent = JSON.stringify(data.raw, null, 2);
      }

    } catch (err) {
      resultEl.textContent = '❌ 请求失败: ' + err.message;
    } finally {
      // ===== 退出 loading 状态 =====
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }
  </script>
</body>
</html>
